<script>
  (function(){
    // ========== KONFIGURASI ==========
    const SUPABASE_URL = 'https://okdvksrprvhgqdyioryf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rZHZrc3JwcnZoZ3FkeWlvcnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mjc5OTYsImV4cCI6MjA4NjUwMzk5Nn0.cfrGXxCgbPWpEdhBGC6RP8JonSTCjN1d6IOr4qyXSQw';

    let supabase = null;
    let allData = [];
    let managementData = [];
    let isAuth = false;
    const PASS = 'Dankos2026';
    let chartInst = null;
    let problemChart = null;
    let weeklyTrend = null;
    let machineComp = null;
    let currentLineFilter = 'ALL';
    let currentStatusFilter = 'ALL';
    let retryCount = 0;
    const MAX_RETRY = 3;

    // ========== INISIALISASI ==========
    async function initSupabase() {
      try {
        if (window.supabase && window.supabase.createClient) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { error } = await supabase.from('monitoring_data').select('count', { count: 'exact', head: true });
          if (error) throw error;
          console.log('✅ Supabase connected');
          showConnStatus(true);
          return true;
        } else {
          throw new Error('Supabase library not loaded');
        }
      } catch (err) {
        console.error('❌ Supabase connection failed:', err);
        showConnStatus(false, err.message);
        return false;
      }
    }

    function showConnStatus(ok, msg = '') {
      const div = document.getElementById('connection-status');
      if (!div) return;
      div.classList.remove('hidden');
      if (ok) {
        div.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-2xl border-l-4 border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30';
        div.innerHTML = '<div class="flex items-center gap-3"><span>✅</span><p class="text-sm font-bold uppercase">TERKONEKSI DATABASE</p></div>';
        setTimeout(() => div.classList.add('hidden'), 3000);
      } else {
        div.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-4 rounded-lg shadow-2xl border-l-4 border-red-500 bg-red-50 dark:bg-red-900/30';
        div.innerHTML = `<div><span>🔴 GAGAL KONEKSI</span><p class="text-xs">${msg || 'Periksa koneksi internet'}</p><button onclick="location.reload()" class="mt-2 px-4 py-1 bg-red-500 text-white rounded">COBA LAGI</button></div>`;
      }
    }

    // ========== LOAD DATA ==========
    async function loadAll() {
      if (!supabase) {
        console.log('Waiting for Supabase...');
        return;
      }
      try {
        console.log('Loading data...');
        const { data: mon, error: e1 } = await supabase.from('monitoring_data').select('*').order('monitoring_date', { ascending: false });
        if (e1) throw e1;

        const { data: mg, error: e2 } = await supabase.from('management_data').select('*').order('created_at', { ascending: false });
        if (e2) throw e2;

        const { data: aud, error: e3 } = await supabase.from('audit_logs').select('*').order('created_at', { ascending: false });
        if (e3) throw e3;

        allData = [
          ...(mon || []).map(d => ({ ...d, table_type: 'monitoring' })),
          ...(mg || []).map(d => ({ ...d, table_type: 'management' })),
          ...(aud || []).map(d => ({ ...d, table_type: 'audit' }))
        ];
        managementData = mg || [];

        console.log('Data loaded:', allData.length, 'records');

        // ====== PASTIKAN UI UPDATE ======
        console.log('Updating UI...');
        updateDashboardUI();
        updateFormDropdowns();
        updateLineFilter();
        updateMonitoringTable();
        if (isAuth) { 
          updateMgmtTable(); 
          updateAuditTable(); 
        }
        updateCriticalAlerts();
        populateWeekSelector();
        console.log('UI Update complete!');

        retryCount = 0;
      } catch (err) {
        console.error('Load error:', err);
        if (retryCount < MAX_RETRY) {
          retryCount++;
          setTimeout(loadAll, 2000);
        }
      }
    }

    function getStatus(op) {
      if (op >= 15000) return 'CRITICAL';
      if (op >= 10000) return 'WARNING';
      return 'NORMAL';
    }

    // ========== UI UPDATES (PAKE NULL CHECK) ==========
    function updateDashboardUI() {
      console.log('Updating Dashboard UI...');
      
      const mon = allData.filter(d => d.table_type === 'monitoring');
      const mgmt = allData.filter(d => d.table_type === 'management');
      const problems = mon.filter(d => d.problem_exists === 'ADA').length;
      const normal = mon.filter(d => d.problem_exists === 'TIDAK ADA').length;
      const total = problems + normal;

      // Helper untuk ambil element
      const el = (id) => document.getElementById(id);
      
      // Update stat cards
      if (el('stat-total')) el('stat-total').innerText = mgmt.length;
      if (el('stat-active')) el('stat-active').innerText = mon.length;
      if (el('stat-problems')) el('stat-problems').innerText = problems;
      
      const lines = new Set(mon.map(d => d.line));
      if (el('stat-lines')) el('stat-lines').innerText = lines.size;

      // Problem ratio
      let pct = total ? ((problems / total) * 100).toFixed(1) : 0;
      let nPct = total ? ((normal / total) * 100).toFixed(1) : 0;
      
      if (el('problem-count')) el('problem-count').innerText = `${problems} UNIT`;
      if (el('normal-count')) el('normal-count').innerText = `${normal} UNIT`;
      
      let barWidth = total ? (problems / total) * 100 : 0;
      if (el('problem-progress-bar')) {
        el('problem-progress-bar').style.width = `${barWidth}%`;
      }
      
      if (el('problem-ratio')) {
        el('problem-ratio').innerHTML = `⚖️ PROBLEM RATIO: <span class="text-red-500">${pct}%</span> : <span class="text-emerald-500">${nPct}%</span>`;
      }

      // ====== CHART: Monitoring Bar ======
      const ctx = document.getElementById('monitoring-chart')?.getContext('2d');
      if (ctx && mon.length) {
        let machines = mon.map(m => ({ machine: m.machine || 'UNKNOWN', op: m.cumulative_op_time || 0 }))
          .sort((a, b) => a.op - b.op);
        if (chartInst) chartInst.destroy();
        chartInst = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: machines.map(m => m.machine),
            datasets: [{
              label: 'OP TIME (HRS)',
              data: machines.map(m => m.op),
              backgroundColor: machines.map(m => m.op >= 15000 ? '#ef4444' : m.op >= 10000 ? '#f59e0b' : '#10b981')
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
        console.log('✅ Bar chart created');
      } else {
        console.warn('⚠️ Monitoring chart not found or no data');
      }

      // ====== CHART: Problem Doughnut ======
      const probCtx = document.getElementById('problem-chart')?.getContext('2d');
      if (probCtx) {
        if (problemChart) problemChart.destroy();
        problemChart = new Chart(probCtx, {
          type: 'doughnut',
          data: {
            labels: [`PROBLEM (${problems}|${pct}%)`, `NORMAL (${normal}|${nPct}%)`],
            datasets: [{ data: [problems, normal], backgroundColor: ['#ef4444', '#10b981'], borderWidth: 2 }]
          },
          options: { cutout: '65%', responsive: true }
        });
        console.log('✅ Doughnut chart created');
      } else {
        console.warn('⚠️ Problem chart not found');
      }
    }

    function updateMonitoringTable() {
      console.log('Updating Monitoring Table...');
      
      let data = allData.filter(d => d.table_type === 'monitoring');
      if (currentLineFilter !== 'ALL') data = data.filter(d => d.line === currentLineFilter);
      if (currentStatusFilter !== 'ALL') data = data.filter(d => getStatus(d.cumulative_op_time || 0) === currentStatusFilter);
      
      const tbody = document.getElementById('monitoring-table');
      const filteredCount = document.getElementById('filtered-count');
      
      if (filteredCount) {
        const totalData = allData.filter(d => d.table_type === 'monitoring').length;
        filteredCount.textContent = `${data.length}/${totalData}`;
      }
      
      if (!tbody) {
        console.warn('⚠️ monitoring-table element not found!');
        return;
      }
      
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center uppercase">TIDAK ADA DATA</td></tr>';
        console.log('No data to display');
        return;
      }
      
      tbody.innerHTML = data.slice(0, 20).map(item => {
        let op = item.cumulative_op_time || 0, st = getStatus(op);
        let stClass = st === 'CRITICAL' ? 'bg-red-100 text-red-700' : (st === 'WARNING' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700');
        return `<tr class="border-b hover:bg-gray-50 dark:hover:bg-gray-700/50">
          <td class="px-4 py-2 font-bold uppercase">${item.line || '-'}</td>
          <td class="px-4 py-2 font-mono">${item.serial_number || '-'}</td>
          <td class="px-4 py-2 uppercase">${item.machine || '-'}</td>
          <td class="px-4 py-2 font-orbitron font-bold">${op} HRS</td>
          <td class="px-4 py-2"><span class="px-2 py-1 rounded-full text-xs font-bold ${item.ijp_condition === 'OK' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">${item.ijp_condition || '-'}</span></td>
          <td class="px-4 py-2"><span class="px-2 py-1 rounded-full text-xs font-bold ${item.problem_exists === 'ADA' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">${item.problem_exists || '-'}</span></td>
          <td class="px-4 py-2"><span class="px-2 py-1 rounded-full text-xs font-bold ${stClass}">${st}</span></td>
        </tr>`;
      }).join('');
      
      console.log(`✅ Monitoring table updated with ${data.length} records`);
    }

    function updateLineFilter() {
      let lines = [...new Set(allData.filter(d => d.table_type === 'monitoring').map(d => d.line).filter(Boolean))];
      let sel = document.getElementById('line-filter');
      if (sel) {
        sel.innerHTML = '<option value="ALL">SEMUA LINE</option>' + lines.map(l => `<option value="${l}">${l}</option>`).join('');
        console.log('✅ Line filter updated:', lines.length, 'lines');
      }
    }

    function updateFormDropdowns() {
      let machines = [...new Set(managementData.map(d => d.machine_name))];
      let machineSel = document.getElementById('machine_dropdown');
      if (machineSel) {
        machineSel.innerHTML = '<option value="">-- SELECT MACHINE --</option>' + machines.map(m => `<option value="${m}">${m}</option>`).join('');
        console.log('✅ Form dropdowns updated:', machines.length, 'machines');
      }
    }

    function populateWeekSelector() {
      let weeks = new Set();
      allData.filter(d => d.table_type === 'monitoring').forEach(d => {
        if (d.monitoring_date) {
          let dte = new Date(d.monitoring_date);
          let week = Math.ceil((((dte - dte.getDay()) - new Date(dte.getFullYear(), 0, 1)) / 86400000 + 1) / 7);
          weeks.add(`${dte.getFullYear()}-W${String(week).padStart(2, '0')}`);
        }
      });
      let sorted = Array.from(weeks).sort().reverse();
      let sel = document.getElementById('week_selector');
      if (sel) {
        sel.innerHTML = '<option value="">-- SELECT WEEK --</option>' + sorted.map(w => `<option value="${w}">WEEK ${w}</option>`).join('');
        if (sorted.length) updateWeeklyAnalysis(sorted[0]);
        sel.onchange = e => updateWeeklyAnalysis(e.target.value);
        console.log('✅ Week selector updated:', sorted.length, 'weeks');
      }
    }

    function updateWeeklyAnalysis(weekStr) {
      if (!weekStr) return;
      let [year, week] = weekStr.split('-W');
      let weekNum = parseInt(week);
      let data = allData.filter(d => d.table_type === 'monitoring' && d.monitoring_date &&
        new Date(d.monitoring_date).getFullYear() == parseInt(year) &&
        Math.ceil((((new Date(d.monitoring_date) - new Date(d.monitoring_date).getDay()) - new Date(year, 0, 1)) / 86400000 + 1) / 7) === weekNum
      );
      let total = data.reduce((s, d) => s + (d.cumulative_op_time || 0), 0);
      
      const el = (id) => document.getElementById(id);
      if (el('weekly-total')) el('weekly-total').innerText = total;
      if (el('weekly-entries')) el('weekly-entries').innerText = data.length;
      if (el('weekly-avg')) el('weekly-avg').innerText = data.length ? Math.round(total / data.length) : 0;

      if (weeklyTrend) weeklyTrend.destroy();
      let sorted = data.sort((a, b) => new Date(a.monitoring_date) - new Date(b.monitoring_date));
      const trendCtx = document.getElementById('weekly-trend-chart')?.getContext('2d');
      if (trendCtx) {
        weeklyTrend = new Chart(trendCtx, {
          type: 'line',
          data: {
            labels: sorted.map(d => new Date(d.monitoring_date).toLocaleDateString()),
            datasets: [{ label: 'OP TIME (HRS)', data: sorted.map(d => d.cumulative_op_time), borderColor: '#10b981', fill: true }]
          }
        });
      }

      let machMap = {};
      data.forEach(d => { let m = d.machine || 'UNKNOWN'; machMap[m] = (machMap[m] || 0) + (d.cumulative_op_time || 0); });
      if (machineComp) machineComp.destroy();
      const compCtx = document.getElementById('machine-comparison-chart')?.getContext('2d');
      if (compCtx) {
        machineComp = new Chart(compCtx, {
          type: 'bar',
          data: {
            labels: Object.keys(machMap),
            datasets: [{ label: 'TOTAL OP TIME', data: Object.values(machMap), backgroundColor: '#06b6d4' }]
          }
        });
      }

      const weekTable = document.getElementById('weekly-table');
      if (weekTable) {
        weekTable.innerHTML = data.map((item, idx) => {
          let inc = 0;
          if (idx > 0 && sorted[idx - 1].serial_number === item.serial_number) inc = Math.max(0, (item.cumulative_op_time || 0) - (sorted[idx - 1].cumulative_op_time || 0));
          return `<tr><td class="px-4 py-2">${new Date(item.monitoring_date).toLocaleDateString()}</td><td class="px-4 py-2">${item.line}</td><td class="px-4 py-2">${item.serial_number}</td><td class="px-4 py-2 font-orbitron">${item.cumulative_op_time || 0}</td><td class="px-4 py-2 text-cyan-600 font-bold">${inc}</td><td class="px-4 py-2">${item.ijp_condition}</td></tr>`;
        }).join('');
      }
    }

    function updateCriticalAlerts() {
      let mon = allData.filter(d => d.table_type === 'monitoring');
      let critical = mon.filter(d => (d.cumulative_op_time || 0) >= 15000);
      let warning = mon.filter(d => (d.cumulative_op_time || 0) >= 10000 && (d.cumulative_op_time || 0) < 15000);
      let html = '';
      critical.forEach(c => {
        html += `<div class="bg-red-50 dark:bg-red-900/20 border-2 border-red-500 rounded-xl p-4 mb-4"><div class="flex gap-3"><div class="text-3xl">🚨</div><div><h3 class="font-orbitron font-bold text-red-700 dark:text-red-400 uppercase">CRITICAL - SERVICE REQUIRED</h3><p class="text-sm">LINE: ${c.line} | SERIAL: ${c.serial_number} | OP: ${c.cumulative_op_time} HRS</p></div></div></div>`;
      });
      warning.forEach(w => {
        html += `<div class="bg-amber-50 dark:bg-amber-900/20 border-2 border-amber-500 rounded-xl p-4 mb-4"><div class="flex gap-3"><div class="text-3xl">⚠️</div><div><h3 class="font-orbitron font-bold text-amber-700 dark:text-amber-400 uppercase">WARNING - SCHEDULE REPLACEMENT</h3><p class="text-sm">LINE: ${w.line} | OP: ${w.cumulative_op_time} HRS</p></div></div></div>`;
      });
      const alertDiv = document.getElementById('critical-alerts');
      if (alertDiv) alertDiv.innerHTML = html;
    }

    function updateMgmtTable() {
      let mg = allData.filter(d => d.table_type === 'management');
      let tbody = document.getElementById('management-table');
      if (!tbody) return;
      if (!mg.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center uppercase">NO IJP DATA REGISTERED</td></tr>';
        return;
      }
      tbody.innerHTML = mg.map(m => `<tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
        <td class="px-4 py-2 uppercase font-semibold">${m.machine_name}</td>
        <td class="px-4 py-2 uppercase">${m.line}</td>
        <td class="px-4 py-2"><div class="flex items-center gap-2"><input type="text" data-id="${m.id}" data-original="${m.serial_number}" value="${m.serial_number}" class="border rounded px-2 py-1 text-sm w-full"><button onclick="window.saveSerial('${m.id}',this)" class="bg-green-500 text-white px-2 py-1 rounded text-xs">✓</button></div></td>
        <td class="px-4 py-2"><button onclick="window.delRecord({id:'${m.id}'})" class="text-red-500 hover:text-red-700 font-bold">DELETE</button></td>
      </tr>`).join('');
    }

    window.saveSerial = async (id, btn) => {
      if (!isAuth) { alert('Login required'); return; }
      if (!supabase) { alert('Database not connected'); return; }
      let input = document.querySelector(`input[data-id="${id}"]`);
      if (!input) return;
      let newVal = input.value.toUpperCase();
      let originalVal = input.dataset.original;
      if (!newVal) return;
      if (newVal === originalVal) return;
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const { error } = await supabase.from('management_data').update({ serial_number: newVal }).eq('id', id);
        if (error) throw error;
        await logAudit('SERIAL UPDATED', `ID:${id} NEW:${newVal}`);
        alert('✓ Serial number updated!');
        loadAll();
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
        input.value = originalVal;
      } finally {
        btn.disabled = false;
        btn.textContent = '✓';
      }
    };

    window.delRecord = async (rec) => {
      if (!isAuth) { alert('Login required'); return; }
      if (!supabase) { alert('Database not connected'); return; }
      if (confirm('DELETE THIS RECORD?')) {
        try {
          await supabase.from('management_data').delete().eq('id', rec.id);
          await logAudit('DELETED', `ID:${rec.id}`);
          loadAll();
          alert('✓ Record deleted');
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
    };

    function updateAuditTable() {
      let aud = allData.filter(d => d.table_type === 'audit');
      let tbody = document.getElementById('audit-table');
      const countEl = document.getElementById('audit-count');
      if (countEl) countEl.textContent = `${aud.length} RECORDS`;
      if (!tbody) return;
      if (!aud.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center uppercase">NO ACTIVITY RECORDED</td></tr>';
        return;
      }
      tbody.innerHTML = aud.map(a => `<tr><td class="px-4 py-2 text-xs font-mono">${new Date(a.created_at).toLocaleString()}</td><td class="px-4 py-2"><span class="px-2 py-1 bg-cyan-100 dark:bg-cyan-900/30 text-cyan-700 rounded text-xs font-bold">${a.user_action}</span></td><td class="px-4 py-2 uppercase text-sm">${a.activity}</td></tr>`).join('');
    }

    async function logAudit(action, details) {
      if (supabase) await supabase.from('audit_logs').insert([{ user_action: action, activity: details }]);
    }

    // ========== SETUP EVENTS (NULL CHECK) ==========
    function setupEvents() {
      const el = (id) => document.getElementById(id);
      
      const loginBtn = el('login-submit');
      if (loginBtn) {
        loginBtn.onclick = () => {
          let pwd = el('login-password')?.value || '';
          if (pwd === PASS) {
            isAuth = true;
            sessionStorage.setItem('ijp_auth', 'true');
            const modal = el('login-modal');
            if (modal) modal.classList.add('hidden');
            updateAuthUI();
            loadAll();
          } else {
            const err = el('login-error');
            if (err) {
              err.classList.remove('hidden');
              setTimeout(() => err.classList.add('hidden'), 2000);
            }
          }
        };
      }

      const logoutBtn = el('logout-btn');
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          isAuth = false;
          sessionStorage.removeItem('ijp_auth');
          updateAuthUI();
          showPage('dashboard');
          logAudit('LOGOUT', 'Manual');
        };
      }

      const themeBtn = el('theme-toggle');
      if (themeBtn) {
        themeBtn.onclick = () => {
          document.documentElement.classList.toggle('dark');
        };
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
          let pg = btn.dataset.nav;
          if ((pg === 'management' || pg === 'audit') && !isAuth) {
            const modal = el('login-modal');
            if (modal) modal.classList.remove('hidden');
            return;
          }
          showPage(pg);
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-emerald-100', 'dark:bg-emerald-900/30', 'text-emerald-700'));
          btn.classList.add('bg-emerald-100', 'dark:bg-emerald-900/30', 'text-emerald-700');
        };
      });

      const resetBtn = el('reset-filters');
      if (resetBtn) {
        resetBtn.onclick = () => {
          currentLineFilter = 'ALL';
          currentStatusFilter = 'ALL';
          const lineFilter = el('line-filter');
          const statusFilter = el('status-filter');
          if (lineFilter) lineFilter.value = 'ALL';
          if (statusFilter) statusFilter.value = 'ALL';
          updateMonitoringTable();
        };
      }

      const lineFilter = el('line-filter');
      if (lineFilter) {
        lineFilter.onchange = e => {
          currentLineFilter = e.target.value;
          updateMonitoringTable();
        };
      }

      const statusFilter = el('status-filter');
      if (statusFilter) {
        statusFilter.onchange = e => {
          currentStatusFilter = e.target.value;
          updateMonitoringTable();
        };
      }

      const exportMon = el('export-monitoring');
      if (exportMon) {
        exportMon.onclick = () => {
          let data = allData.filter(d => d.table_type === 'monitoring');
          if (!data.length) { alert('No data to export'); return; }
          let ws = XLSX.utils.json_to_sheet(data.map(d => ({
            DATE: d.monitoring_date,
            LINE: d.line,
            SERIAL: d.serial_number,
            MACHINE: d.machine,
            'OP TIME': d.cumulative_op_time,
            KONDISI: d.ijp_condition,
            PROBLEM: d.problem_exists,
            NOTES: d.notes
          })));
          let wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Monitoring');
          XLSX.writeFile(wb, `monitoring-${new Date().toISOString().split('T')[0]}.xlsx`);
        };
      }

      const exportMgmt = el('export-management');
      if (exportMgmt) {
        exportMgmt.onclick = () => {
          if (!isAuth) { alert('Login required'); return; }
          let data = allData.filter(d => d.table_type === 'management');
          if (!data.length) { alert('No data to export'); return; }
          let ws = XLSX.utils.json_to_sheet(data.map(d => ({
            MACHINE: d.machine_name,
            LINE: d.line,
            'SERIAL NUMBER': d.serial_number
          })));
          let wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Management');
          XLSX.writeFile(wb, `management-${new Date().toISOString().split('T')[0]}.xlsx`);
        };
      }

      const exportAudit = el('export-audit');
      if (exportAudit) {
        exportAudit.onclick = () => {
          if (!isAuth) { alert('Login required'); return; }
          let data = allData.filter(d => d.table_type === 'audit');
          if (!data.length) { alert('No data to export'); return; }
          let ws = XLSX.utils.json_to_sheet(data.map(d => ({
            TIMESTAMP: new Date(d.created_at).toLocaleString(),
            ACTION: d.user_action,
            DETAILS: d.activity
          })));
          let wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Audit');
          XLSX.writeFile(wb, `audit-${new Date().toISOString().split('T')[0]}.xlsx`);
        };
      }

      const machineDropdown = el('machine_dropdown');
      if (machineDropdown) {
        machineDropdown.onchange = function() {
          let serSel = el('serial_dropdown');
          let editBtn = el('edit-serial-btn');
          if (this.value) {
            let recs = managementData.filter(m => m.machine_name === this.value);
            if (serSel) {
              serSel.innerHTML = '<option value="">-- SELECT SERIAL --</option>' + recs.map(r => `<option value="${r.serial_number}" data-line="${r.line}">${r.serial_number}</option>`).join('');
            }
            if (editBtn) editBtn.classList.remove('hidden');
          } else {
            if (serSel) serSel.innerHTML = '<option value="">-- SELECT --</option>';
            if (editBtn) editBtn.classList.add('hidden');
          }
          const machineInput = el('machine');
          if (machineInput) machineInput.value = this.value;
        };
      }

      const serialDropdown = el('serial_dropdown');
      if (serialDropdown) {
        serialDropdown.onchange = function() {
          let opt = this.options[this.selectedIndex];
          const lineInput = el('line');
          if (lineInput && opt) lineInput.value = opt?.dataset?.line || '';
        };
      }

      const problemExists = el('problem_exists');
      if (problemExists) {
        problemExists.onchange = e => {
          const section = el('problem-section');
          if (section) section.classList.toggle('hidden', e.target.value !== 'ADA');
        };
      }

      const monitoringForm = el('monitoring-form');
      if (monitoringForm) {
        monitoringForm.onsubmit = async (e) => {
          e.preventDefault();
          if (!supabase) {
            alert('Database tidak terhubung!');
            return;
          }

          const submitBtn = e.target.querySelector('button[type="submit"]');
          const originalText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'MENYIMPAN...';

          try {
            let filterReplaced = el('filter_replaced')?.checked || false;
            let finalOp = parseInt(el('cumulative_op_time')?.value || 0) || 0;
            if (filterReplaced) finalOp = 0;

            let photoUrl = '';
            let file = el('photo_upload')?.files[0];
            if (file && el('problem_exists')?.value === 'ADA') {
              let fname = `ijp-photos/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
              let { error: uploadError } = await supabase.storage.from('ijp_monitoring').upload(fname, file);
              if (!uploadError) {
                let { data: urlData } = supabase.storage.from('ijp_monitoring').getPublicUrl(fname);
                photoUrl = urlData.publicUrl;
              }
            }

            let data = {
              line: el('line')?.value?.toUpperCase() || '',
              serial_number: el('serial_dropdown')?.value || '',
              machine: el('machine')?.value || '',
              monitoring_date: el('monitoring_date')?.value || '',
              cumulative_op_time: finalOp,
              weekly_increment: 0,
              ijp_condition: el('ijp_condition')?.value || '',
              problem_exists: el('problem_exists')?.value || '',
              problem_description: el('problem_description')?.value || '',
              problem_action: el('problem_action')?.value || '',
              notes: el('notes')?.value || '',
              photo_url: photoUrl,
              filter_replaced: filterReplaced
            };

            const { error } = await supabase.from('monitoring_data').insert([data]);
            if (error) throw error;

            await logAudit('MONITORING ADDED', `SERIAL:${data.serial_number} OP:${finalOp}HRS`);

            const successDiv = el('form-success');
            if (successDiv) {
              successDiv.innerHTML = '<p class="text-emerald-700 dark:text-emerald-400 font-semibold">✓ DATA BERHASIL DISIMPAN!</p>';
              successDiv.classList.remove('hidden');
              setTimeout(() => successDiv.classList.add('hidden'), 3000);
            }

            monitoringForm.reset();
            const problemSection = el('problem-section');
            if (problemSection) problemSection.classList.add('hidden');
            const dateInput = el('monitoring_date');
            if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

            await loadAll();

          } catch (err) {
            console.error('Submit error:', err);
            alert('Error: ' + err.message);
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
          }
        };
      }

      const managementForm = el('management-form');
      if (managementForm) {
        managementForm.onsubmit = async (e) => {
          e.preventDefault();
          if (!isAuth) {
            alert('Login required!');
            return;
          }
          if (!supabase) {
            alert('Database tidak terhubung!');
            return;
          }

          const submitBtn = e.target.querySelector('button[type="submit"]');
          const originalText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'MENYIMPAN...';

          try {
            let data = {
              machine_name: el('machine_name')?.value?.toUpperCase() || '',
              line: el('line_mg')?.value?.toUpperCase() || '',
              serial_number: el('service')?.value?.toUpperCase() || ''
            };

            const { error } = await supabase.from('management_data').insert([data]);
            if (error) throw error;

            await logAudit('IJP REGISTERED', data.machine_name);

            const successDiv = el('management-success');
            if (successDiv) {
              successDiv.innerHTML = '<p class="text-emerald-700 dark:text-emerald-400 font-semibold">✓ DATA BERHASIL DITAMBAHKAN!</p>';
              successDiv.classList.remove('hidden');
              setTimeout(() => successDiv.classList.add('hidden'), 3000);
            }

            managementForm.reset();
            await loadAll();

          } catch (err) {
            console.error('Management submit error:', err);
            alert('Error: ' + err.message);
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
          }
        };
      }

      const editSerialBtn = el('edit-serial-btn');
      if (editSerialBtn) {
        editSerialBtn.onclick = () => {
          showPage('management');
          const mgmtNav = document.querySelector('[data-nav="management"]');
          if (mgmtNav) mgmtNav.classList.add('bg-emerald-100');
        };
      }
    }

    // ========== HELPER ==========
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      const target = document.getElementById(`page-${page}`);
      if (target) target.classList.remove('hidden');
    }

    function updateAuthUI() {
      const ind = document.getElementById('auth-indicator');
      const txt = document.getElementById('auth-text');
      const logout = document.getElementById('logout-btn');
      if (isAuth) {
        if (ind) ind.className = 'w-2 h-2 rounded-full bg-emerald-500';
        if (txt) txt.innerText = 'LOGGED IN';
        if (logout) logout.classList.remove('hidden');
      } else {
        if (ind) ind.className = 'w-2 h-2 rounded-full bg-red-500';
        if (txt) txt.innerText = 'NOT LOGGED IN';
        if (logout) logout.classList.add('hidden');
      }
    }

    function updateClock() {
      let d = new Date();
      const clock = document.getElementById('current-time');
      if (clock) {
        clock.innerText = d.toLocaleString('en-US', {
          weekday: 'short',
          year: 'numeric',
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).toUpperCase();
      }
    }

    // ========== INIT ==========
    (async function() {
      console.log('🚀 Initializing app...');
      setupEvents();
      updateClock();
      setInterval(updateClock, 1000);

      const dateInput = document.getElementById('monitoring_date');
      if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

      let authSaved = sessionStorage.getItem('ijp_auth');
      if (authSaved === 'true') isAuth = true;
      updateAuthUI();

      let connected = await initSupabase();
      if (connected) {
        await loadAll();
        try {
          supabase
            .channel('table-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'monitoring_data' }, () => loadAll())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'management_data' }, () => loadAll())
            .subscribe();
          console.log('✅ Realtime subscription active');
        } catch (e) {
          console.log('Realtime not available, will use manual refresh');
        }
      }
      console.log('✅ App ready!');
    })();

  })();
</script>
