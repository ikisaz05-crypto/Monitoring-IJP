<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring IJP - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow p-6">
        <h1 class="text-3xl font-bold text-emerald-600 mb-4">📊 Monitoring IJP</h1>
        <p id="status" class="text-gray-600">Loading...</p>
        <div id="data-count" class="mt-4 text-lg font-bold"></div>
        <pre id="debug" class="mt-4 p-4 bg-gray-100 rounded-lg text-sm overflow-auto max-h-96"></pre>
    </div>

    <script>
        const SUPABASE_URL = 'https://okdvksrprvhgqdyioryf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rZHZrc3JwcnZoZ3FkeWlvcnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mjc5OTYsImV4cCI6MjA4NjUwMzk5Nn0.cfrGXxCgbPWpEdhBGC6RP8JonSTCjN1d6IOr4qyXSQw';

        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('data-count');
        const debugEl = document.getElementById('debug');

        async function testConnection() {
            try {
                statusEl.innerText = '⏳ Menghubungkan ke Supabase...';
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data, error, count } = await supabase
                    .from('monitoring_data')
                    .select('*', { count: 'exact', head: true });
                
                if (error) throw error;
                
                statusEl.innerText = '✅ Koneksi Berhasil!';
                countEl.innerText = `📊 Total Data: ${count} records`;
                
                // Ambil 5 data terakhir untuk test
                const { data: sample } = await supabase
                    .from('monitoring_data')
                    .select('*')
                    .limit(5);
                
                debugEl.innerText = JSON.stringify(sample, null, 2);
                
            } catch (err) {
                statusEl.innerText = '❌ Error: ' + err.message;
                debugEl.innerText = err.stack || err.message;
            }
        }

        testConnection();
    </script>
</body>
</html>
