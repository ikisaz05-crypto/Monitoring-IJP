<!DOCTYPE html>
<html>
<head>
    <title>IJP Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .font-orbitron { font-family: 'Courier New', monospace; font-weight: bold; }
        .hidden { display: none !important; }
        .page { display: none; }
        #page-dashboard { display: block; }
    </style>
</head>
<body class="p-4 bg-gray-100">
    <div class="max-w-7xl mx-auto">

        <!-- HEADER -->
        <div class="bg-white p-4 rounded-xl shadow mb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-600">📊 IJP Monitoring</h1>
            <div class="flex items-center gap-4">
                <span id="auth-status" class="text-sm font-bold text-red-500">🔴 NOT LOGGED IN</span>
                <button id="btn-login" class="px-4 py-2 bg-emerald-500 text-white rounded-lg font-bold">LOGIN</button>
                <button id="btn-logout" class="px-4 py-2 bg-red-500 text-white rounded-lg font-bold hidden">LOGOUT</button>
                <button id="btn-theme" class="px-4 py-2 bg-gray-200 rounded-lg">🌓</button>
            </div>
        </div>

        <!-- LOGIN MODAL -->
        <div id="modal-login" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
                <h2 class="text-2xl font-bold text-center mb-4">🔐 LOGIN</h2>
                <input id="input-password" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg border mb-3" />
                <button id="btn-submit-login" class="w-full py-3 bg-emerald-500 text-white rounded-lg font-bold">MASUK</button>
                <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden">❌ PASSWORD SALAH!</p>
            </div>
        </div>

        <!-- NAVIGASI -->
        <div class="bg-white p-2 rounded-xl shadow mb-4 flex gap-2 overflow-x-auto">
            <button class="nav-btn px-4 py-2 rounded-lg font-bold bg-emerald-500 text-white" data-page="dashboard">📊 DASHBOARD</button>
            <button class="nav-btn px-4 py-2 rounded-lg font-bold hover:bg-gray-200" data-page="form">📝 FORM</button>
            <button class="nav-btn px-4 py-2 rounded-lg font-bold hover:bg-gray-200" data-page="management">⚙️ MANAGEMENT</button>
            <button class="nav-btn px-4 py-2 rounded-lg font-bold hover:bg-gray-200" data-page="audit">📋 AUDIT</button>
        </div>

        <!-- KONTEN -->
        <div id="page-dashboard" class="page">
            <div class="grid grid-cols-4 gap-4 mb-4">
                <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-400 text-xs">TOTAL IJP</p><p id="stat-total" class="text-3xl font-bold">0</p></div>
                <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-400 text-xs">MONITORING</p><p id="stat-active" class="text-3xl font-bold">0</p></div>
                <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-400 text-xs">PROBLEMS</p><p id="stat-problems" class="text-3xl font-bold">0</p></div>
                <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-400 text-xs">LINES</p><p id="stat-lines" class="text-3xl font-bold">0</p></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-white p-4 rounded-xl shadow"><canvas id="chart1" style="height:250px"></canvas></div>
                <div class="bg-white p-4 rounded-xl shadow"><canvas id="chart2" style="height:250px"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow" id="critical-alerts"></div>
            <div class="bg-white p-4 rounded-xl shadow mt-4">
                <h3 class="font-bold mb-2">📋 Monitoring Data</h3>
                <div class="overflow-auto max-h-96">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-100 sticky top-0"><tr><th class="p-2 text-left">LINE</th><th class="p-2 text-left">SERIAL</th><th class="p-2 text-left">MACHINE</th><th class="p-2 text-left">OP</th><th class="p-2 text-left">STATUS</th></tr></thead>
                        <tbody id="table-monitoring"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="page-form" class="page hidden">
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-xl font-bold mb-4">📝 INPUT MONITORING</h2>
                <form id="form-monitoring" class="grid grid-cols-3 gap-4">
                    <input id="f-line" placeholder="LINE" class="px-4 py-3 rounded-lg border" required />
                    <input id="f-serial" placeholder="SERIAL" class="px-4 py-3 rounded-lg border" required />
                    <input id="f-machine" placeholder="MACHINE" class="px-4 py-3 rounded-lg border" required />
                    <input id="f-date" type="date" class="px-4 py-3 rounded-lg border" required />
                    <input id="f-op" type="number" placeholder="OP TIME" class="px-4 py-3 rounded-lg border" required />
                    <select id="f-condition" class="px-4 py-3 rounded-lg border">
                        <option value="OK">OK</option><option value="NG">NG</option>
                    </select>
                    <select id="f-problem" class="px-4 py-3 rounded-lg border">
                        <option value="TIDAK ADA">TIDAK ADA</option><option value="ADA">ADA</option>
                    </select>
                    <input id="f-notes" placeholder="NOTES" class="px-4 py-3 rounded-lg border" />
                    <button type="submit" class="px-6 py-3 bg-emerald-500 text-white rounded-lg font-bold">💾 SIMPAN</button>
                </form>
                <div id="form-success" class="hidden mt-4 p-3 bg-emerald-100 text-emerald-700 rounded-lg"></div>
            </div>
        </div>

        <div id="page-management" class="page hidden">
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-xl font-bold mb-4">⚙️ REGISTER IJP</h2>
                <form id="form-management" class="grid grid-cols-3 gap-4">
                    <input id="m-machine" placeholder="MACHINE" class="px-4 py-3 rounded-lg border" required />
                    <input id="m-line" placeholder="LINE" class="px-4 py-3 rounded-lg border" required />
                    <input id="m-serial" placeholder="SERIAL" class="px-4 py-3 rounded-lg border" required />
                    <button type="submit" class="px-6 py-3 bg-emerald-500 text-white rounded-lg font-bold">💾 REGISTER</button>
                </form>
                <div id="mgmt-success" class="hidden mt-4 p-3 bg-emerald-100 text-emerald-700 rounded-lg"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow mt-4">
                <h3 class="font-bold mb-2">📋 Registered IJP</h3>
                <table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-2 text-left">MACHINE</th><th class="p-2 text-left">LINE</th><th class="p-2 text-left">SERIAL</th><th class="p-2 text-left">ACTION</th></tr></thead><tbody id="table-management"></tbody></table>
            </div>
        </div>

        <div id="page-audit" class="page hidden">
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-xl font-bold mb-4">📋 AUDIT LOG</h2>
                <table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-2 text-left">TIME</th><th class="p-2 text-left">ACTION</th><th class="p-2 text-left">DETAIL</th></tr></thead><tbody id="table-audit"></tbody></table>
            </div>
        </div>

    </div>

    <script>
        // ===== KONFIGURASI =====
        const SUPABASE_URL = 'https://okdvksrprvhgqdyioryf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rZHZrc3JwcnZoZ3FkeWlvcnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5Mjc5OTYsImV4cCI6MjA4NjUwMzk5Nn0.cfrGXxCgbPWpEdhBGC6RP8JonSTCjN1d6IOr4qyXSQw';
        const PASS = 'Dankos2026';

        // HANYA 1 DEKLARASI supabase
        let supabase = null;
        let allData = [];
        let isAuth = false;
        let chart1 = null;
        let chart2 = null;

        // ===== HELPER =====
        function getEl(id) {
            const el = document.getElementById(id);
            if (!el) console.warn('⚠️ Element not found:', id);
            return el;
        }

        // ===== SUPABASE =====
        async function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { error } = await supabase.from('monitoring_data').select('count', { count: 'exact', head: true });
                if (error) throw error;
                console.log('✅ DB Connected');
                return true;
            } catch (e) {
                alert('❌ Gagal koneksi ke database! Periksa koneksi internet.');
                return false;
            }
        }

        // ===== LOAD DATA =====
        async function loadData() {
            if (!supabase) return;
            try {
                console.log('Loading data...');
                const { data: mon, error: e1 } = await supabase.from('monitoring_data').select('*').order('monitoring_date', { ascending: false });
                if (e1) throw e1;

                const { data: mg, error: e2 } = await supabase.from('management_data').select('*').order('created_at', { ascending: false });
                if (e2) throw e2;

                const { data: aud, error: e3 } = await supabase.from('audit_logs').select('*').order('created_at', { ascending: false });
                if (e3) throw e3;

                allData = [
                    ...(mon || []).map(d => ({ ...d, type: 'monitoring' })),
                    ...(mg || []).map(d => ({ ...d, type: 'management' })),
                    ...(aud || []).map(d => ({ ...d, type: 'audit' }))
                ];

                console.log('✅ Data loaded:', allData.length, 'records');
                renderAll();
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        // ===== RENDER =====
        function renderAll() {
            renderDashboard();
            renderMonitoring();
            renderManagement();
            renderAudit();
            renderAlerts();
        }

        function renderDashboard() {
            const mon = allData.filter(d => d.type === 'monitoring');
            const mg = allData.filter(d => d.type === 'management');
            const problems = mon.filter(d => d.problem_exists === 'ADA').length;
            const lines = new Set(mon.map(d => d.line));

            const totalEl = getEl('stat-total');
            const activeEl = getEl('stat-active');
            const problemsEl = getEl('stat-problems');
            const linesEl = getEl('stat-lines');

            if (totalEl) totalEl.innerText = mg.length;
            if (activeEl) activeEl.innerText = mon.length;
            if (problemsEl) problemsEl.innerText = problems;
            if (linesEl) linesEl.innerText = lines.size;

            // Chart 1
            const ctx1 = getEl('chart1')?.getContext('2d');
            if (ctx1 && mon.length) {
                if (chart1) chart1.destroy();
                const data = mon.map(m => ({ machine: m.machine || 'Unknown', op: m.cumulative_op_time || 0 })).sort((a, b) => a.op - b.op);
                chart1 = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d.machine).slice(0, 10),
                        datasets: [{ label: 'OP Time (HRS)', data: data.map(d => d.op).slice(0, 10), backgroundColor: '#10b981' }]
                    },
                    options: { responsive: true }
                });
            }

            // Chart 2
            const ctx2 = getEl('chart2')?.getContext('2d');
            if (ctx2) {
                if (chart2) chart2.destroy();
                const normal = mon.filter(d => d.problem_exists === 'TIDAK ADA').length;
                chart2 = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['PROBLEM', 'NORMAL'],
                        datasets: [{ data: [problems, normal], backgroundColor: ['#ef4444', '#10b981'] }]
                    },
                    options: { cutout: '65%', responsive: true }
                });
            }
        }

        function renderMonitoring() {
            const data = allData.filter(d => d.type === 'monitoring');
            const tbody = getEl('table-monitoring');
            if (!tbody) return;
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Tidak ada data</td></tr>';
                return;
            }
            tbody.innerHTML = data.slice(0, 50).map(d => `
                <tr class="border-b">
                    <td class="p-2 font-bold">${d.line || '-'}</td>
                    <td class="p-2">${d.serial_number || '-'}</td>
                    <td class="p-2">${d.machine || '-'}</td>
                    <td class="p-2 font-orbitron">${d.cumulative_op_time || 0} HRS</td>
                    <td class="p-2"><span class="px-2 py-1 rounded-full text-xs ${d.problem_exists === 'ADA' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">${d.problem_exists || '-'}</span></td>
                </tr>
            `).join('');
        }

        function renderManagement() {
            const data = allData.filter(d => d.type === 'management');
            const tbody = getEl('table-management');
            if (!tbody) return;
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center">Tidak ada data</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(d => `
                <tr class="border-b">
                    <td class="p-2 font-bold">${d.machine_name || '-'}</td>
                    <td class="p-2">${d.line || '-'}</td>
                    <td class="p-2">${d.serial_number || '-'}</td>
                    <td class="p-2">
                        <button onclick="hapusManagement('${d.id}')" class="px-3 py-1 bg-red-500 text-white rounded text-xs">HAPUS</button>
                    </td>
                </tr>
            `).join('');
        }

        window.hapusManagement = async (id) => {
            if (!isAuth) return alert('Login dulu!');
            if (!confirm('Hapus data ini?')) return;
            await supabase.from('management_data').delete().eq('id', id);
            loadData();
        };

        function renderAudit() {
            const data = allData.filter(d => d.type === 'audit');
            const tbody = getEl('table-audit');
            if (!tbody) return;
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center">Tidak ada aktivitas</td></tr>';
                return;
            }
            tbody.innerHTML = data.slice(0, 50).map(d => `
                <tr class="border-b">
                    <td class="p-2 text-xs">${new Date(d.created_at).toLocaleString()}</td>
                    <td class="p-2"><span class="px-2 py-1 bg-blue-100 rounded text-xs">${d.user_action || '-'}</span></td>
                    <td class="p-2">${d.activity || '-'}</td>
                </tr>
            `).join('');
        }

        function renderAlerts() {
            const mon = allData.filter(d => d.type === 'monitoring');
            const critical = mon.filter(d => (d.cumulative_op_time || 0) >= 15000);
            const warning = mon.filter(d => (d.cumulative_op_time || 0) >= 10000 && (d.cumulative_op_time || 0) < 15000);
            let html = '';
            critical.forEach(c => { html += `<div class="bg-red-50 border-l-4 border-red-500 p-3 mb-2 rounded">🚨 CRITICAL: ${c.machine} - ${c.cumulative_op_time} HRS</div>`; });
            warning.forEach(w => { html += `<div class="bg-yellow-50 border-l-4 border-yellow-500 p-3 mb-2 rounded">⚠️ WARNING: ${w.machine} - ${w.cumulative_op_time} HRS</div>`; });
            const alertEl = getEl('critical-alerts');
            if (alertEl) alertEl.innerHTML = html || '<p class="text-green-500">✅ Semua aman</p>';
        }

        // ===== EVENT LISTENER =====
        document.addEventListener('DOMContentLoaded', function() {

            // LOGIN
            document.getElementById('btn-login').addEventListener('click', function() {
                document.getElementById('modal-login').classList.remove('hidden');
            });

            document.getElementById('btn-submit-login').addEventListener('click', function() {
                const pwd = document.getElementById('input-password').value;
                if (pwd === PASS) {
                    isAuth = true;
                    document.getElementById('modal-login').classList.add('hidden');
                    document.getElementById('auth-status').innerHTML = '🟢 LOGGED IN';
                    document.getElementById('auth-status').className = 'text-sm font-bold text-emerald-500';
                    document.getElementById('btn-login').classList.add('hidden');
                    document.getElementById('btn-logout').classList.remove('hidden');
                    loadData();
                } else {
                    const err = document.getElementById('login-error');
                    err.classList.remove('hidden');
                    setTimeout(() => err.classList.add('hidden'), 2000);
                }
            });

            // LOGOUT
            document.getElementById('btn-logout').addEventListener('click', function() {
                isAuth = false;
                document.getElementById('auth-status').innerHTML = '🔴 NOT LOGGED IN';
                document.getElementById('auth-status').className = 'text-sm font-bold text-red-500';
                document.getElementById('btn-login').classList.remove('hidden');
                document.getElementById('btn-logout').classList.add('hidden');
            });

            // THEME
            document.getElementById('btn-theme').addEventListener('click', function() {
                document.documentElement.classList.toggle('dark');
                document.body.classList.toggle('bg-gray-100');
                document.body.classList.toggle('dark:bg-gray-900');
            });

            // NAVIGASI
            document.querySelectorAll('.nav-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const page = this.dataset.page;
                    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
                    document.getElementById('page-' + page).classList.remove('hidden');
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-emerald-500', 'text-white'));
                    this.classList.add('bg-emerald-500', 'text-white');

                    if ((page === 'management' || page === 'audit') && !isAuth) {
                        document.getElementById('modal-login').classList.remove('hidden');
                    }
                });
            });

            // FORM MONITORING
            document.getElementById('form-monitoring').addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!supabase) return alert('DB tidak terhubung!');

                const data = {
                    line: document.getElementById('f-line').value.toUpperCase(),
                    serial_number: document.getElementById('f-serial').value.toUpperCase(),
                    machine: document.getElementById('f-machine').value.toUpperCase(),
                    monitoring_date: document.getElementById('f-date').value,
                    cumulative_op_time: parseInt(document.getElementById('f-op').value) || 0,
                    ijp_condition: document.getElementById('f-condition').value,
                    problem_exists: document.getElementById('f-problem').value,
                    notes: document.getElementById('f-notes').value || ''
                };

                await supabase.from('monitoring_data').insert([data]);
                const success = document.getElementById('form-success');
                success.innerHTML = '✅ Data berhasil disimpan!';
                success.classList.remove('hidden');
                setTimeout(() => success.classList.add('hidden'), 3000);
                this.reset();
                loadData();
            });

            // FORM MANAGEMENT
            document.getElementById('form-management').addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!isAuth) return alert('Login dulu!');
                if (!supabase) return alert('DB tidak terhubung!');

                const data = {
                    machine_name: document.getElementById('m-machine').value.toUpperCase(),
                    line: document.getElementById('m-line').value.toUpperCase(),
                    serial_number: document.getElementById('m-serial').value.toUpperCase()
                };

                await supabase.from('management_data').insert([data]);
                const success = document.getElementById('mgmt-success');
                success.innerHTML = '✅ Data berhasil ditambahkan!';
                success.classList.remove('hidden');
                setTimeout(() => success.classList.add('hidden'), 3000);
                this.reset();
                loadData();
            });

            // START
            (async function() {
                if (await initSupabase()) {
                    await loadData();
                }
            })();

        });
    </script>

</body>
</html>
